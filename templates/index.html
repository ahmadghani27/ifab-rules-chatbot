<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WasitBot - Asisten Aturan IFAB</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <main class="chat-wrapper">
        <!-- Header -->
        <header class="chat-header">
            <div class="header-left">
                <div class="header-icon">
                    ⚽
                </div>
                <div class="header-title">
                    <h2>WasitBot</h2>
                    <span class="badge">IFAB Rules Engine</span>
                </div>
            </div>

            <div class="header-actions">
                <!-- Tombol Toggle Tema -->
                <button id="themeToggle" class="btn-icon" title="Ubah Tema" aria-label="Ubah Tema">
                    <!-- Icon Sun/Moon (Render via JS) -->
                    <svg class="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
                    <svg class="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                </button>

                <!-- Tombol Clear Chat -->
                <button id="clearBtn" class="btn-icon" title="Hapus Percakapan" aria-label="Hapus Percakapan">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="3 6 5 6 21 6"></polyline>
                        <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                    </svg>
                </button>
            </div>
        </header>

        <!-- Chat Area -->
        <section class="chat-box" id="chatBox">
            <div class="message bot-message">
                <div class="bot-avatar" title="WasitBot">👮‍♂️</div>
                <div class="message-content">
                    Halo! Saya WasitBot. Ceritakan insiden atau pertanyaan seputar aturan permainan (Offside, Handball, VAR, dll.), dan saya akan jelaskan berdasarkan regulasi resmi IFAB.
                </div>
            </div>
        </section>

        <!-- Input Area -->
        <footer class="chat-input-area">
            <input 
                type="text" 
                id="userInput" 
                placeholder="Tanyakan situasi pertandingan..." 
                autocomplete="off"
            >
            <button id="sendBtn" aria-label="Kirim Pesan">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </footer>
    </main>

    <!-- External JavaScript File -->
    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
</body>
</html>
